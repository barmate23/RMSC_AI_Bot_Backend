
# =============================================================
# RMSC AI Bot – Application Configuration
# =============================================================

spring:
  application:
    name: rmsc-ai-bot

  # -----------------------------------------------------------
  # DATASOURCE – PostgreSQL 16
  # -----------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rmsc_ai_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: RmscAiHikariPool

  # -----------------------------------------------------------
  # JPA / HIBERNATE
  # -----------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # -----------------------------------------------------------
  # FLYWAY – database migration
  # -----------------------------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  # -----------------------------------------------------------
  # SPRING AI – OpenRouter (OpenAI-compatible endpoint)
  # -----------------------------------------------------------
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY:your-openrouter-api-key-here}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://openrouter.ai/api}
      chat:
        options:
          model: ${OPENROUTER_CHAT_MODEL:meta-llama/llama-3-8b-instruct:free}
          temperature: 0.3
          max-tokens: 2048
      embedding:
        options:
          model: ${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}

    # ---------------------------------------------------------
    # Spring AI Retry – handle upstream 429 rate-limit errors
    # ---------------------------------------------------------
    retry:
      max-attempts: 3
      on-http-codes: 429,503
      exclude-on-http-codes: 400,401,403,404
      backoff:
        initial-interval: 2000   # 2s initial wait
        multiplier: 2.0          # doubles each retry
        max-interval: 10000      # cap at 10s

    # ---------------------------------------------------------
    # PGVector Store – managed by Spring AI
    # ---------------------------------------------------------
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: false   # Flyway manages the schema

  # -----------------------------------------------------------
  # RABBITMQ
  # -----------------------------------------------------------
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:100.98.151.73}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  # -----------------------------------------------------------
  # JACKSON
  # -----------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# =============================================================
# SERVER
# =============================================================
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# =============================================================
# ACTUATOR
# =============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always

# =============================================================
# OPENROUTER CLIENT (custom application properties)
# =============================================================
openrouter:
  api-key: ${OPENROUTER_API_KEY:your-openrouter-api-key-here}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  chat-model: ${OPENROUTER_CHAT_MODEL:meta-llama/llama-3-8b-instruct:free}
  embedding-model: ${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
  temperature: 0.3
  max-tokens: 2048
  connect-timeout-ms: 10000
  read-timeout-ms: 60000

# =============================================================
# LOGGING
# =============================================================
logging:
  level:
    root: INFO
    com.rmsc.ai: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/rmsc-ai-bot.log
